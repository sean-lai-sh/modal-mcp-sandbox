[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "modal-vm-wrapper"
version = "0.1.0"
description = "MCP-first Modal VM wrapper for agent sandboxes"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "modal>=0.72.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
